<main class="main-container" style="margin-top: 80px; max-width: 500px; margin-left: auto; margin-right: auto; padding: 20px;">
    <h2>Add a New Shift</h2>

    <form (submit)="onSave($event)">
        <div class="form-group">
            <label for="shiftName">Shift Name (Unique)</label>
            <input type="text" id="shiftName" name="shiftName" [(ngModel)]="shiftName" placeholder="e.g., Morning Shift A" required [disabled]="isSaving">
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" [(ngModel)]="date" required [disabled]="isSaving">
        </div>

        <div class="form-group-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label for="startTime">Start Time</label>
                <input type="time" id="startTime" name="startTime" [(ngModel)]="startTime" required [disabled]="isSaving">
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label for="endTime">End Time</label>
                <input type="time" id="endTime" name="endTime" [(ngModel)]="endTime" required [disabled]="isSaving">
            </div>
        </div>

        <div class="form-group">
            <label for="hourlyWage">Hourly Wage ($)</label>
            <input type="number" id="hourlyWage" name="hourlyWage" [(ngModel)]="hourlyWage" placeholder="e.g., 20.50" required [disabled]="isSaving">
        </div>

        <div class="form-group">
            <label for="workplace">Workplace</label>
            <select id="workplace" name="workplace" [(ngModel)]="workplace" required [disabled]="isSaving">
                <option value="" disabled selected>Select a workplace</option>
                <option *ngFor="let place of workplaces" [value]="place">{{ place }}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" [(ngModel)]="comments" rows="3" placeholder="Any specific notes..." [disabled]="isSaving"></textarea>
        </div>

        <div class="error-message" *ngIf="errorMessage" style="color: #dc2626; margin-bottom: 15px; font-size: 0.9rem;">
            {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="isSaving" style="display: flex; justify-content: center; align-items: center; height: 45px; width: 100%;">
            <span *ngIf="!isSaving">Save Shift</span>
            <div class="spinner" *ngIf="isSaving"></div>
        </button>
    </form>
</main>
